name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            client:
              - 'apps/client/**'
              - '.github/workflows/**'
              - '.githooks/**'
              - 'scripts/**'
              - 'Makefile'

  client:
    name: Client
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Reads the `volta.node` pin, so CI and local Node never drift.
          node-version-file: apps/client/package.json
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Cache Elm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('apps/client/elm.json', 'apps/client/review/elm.json') }}
          restore-keys: elm-${{ runner.os }}-
      - run: npm ci
      - run: make fmt-check lint test build test-hooks
        working-directory: .

  # Smoke test of the production bundle in real browsers. Runs after `client`
  # so a broken build or lint fails fast without paying for the browsers.
  client-e2e:
    name: Client e2e
    needs: [changes, client]
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/client/package.json
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Cache Elm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('apps/client/elm.json', 'apps/client/review/elm.json') }}
          restore-keys: elm-${{ runner.os }}-
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - run: make e2e
        working-directory: .
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/client/playwright-report/
          retention-days: 14

  # Repository-level guards. Not path-filtered: they run on every change.
  repo:
    name: Repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint workflows
        # rhysd/actionlint ships no JS action; its Docker image bundles shellcheck.
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      # Squash merges turn the PR title into the commit on main, so it must be a
      # Conventional Commit. Keep the regex identical to the commit-msg hook's.
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CONVENTIONAL_COMMIT_REGEX='^(feat|fix|docs|style|refactor|test|chore|build|ci|perf|revert)(\([a-zA-Z0-9_./-]+\))?!?: [^ ].*$'
          if [[ $PR_TITLE =~ $CONVENTIONAL_COMMIT_REGEX ]]; then
            echo "PR title is a Conventional Commit: $PR_TITLE"
          else
            echo "::error title=PR title is not a Conventional Commit::Expected '<type>(<optional scope>): <description>' with type one of feat, fix, docs, style, refactor, test, chore, build, ci, perf, revert. Got: $PR_TITLE"
            exit 1
          fi

  # Single required status check: fails only if a needed job failed or was
  # cancelled. Jobs skipped by path filters count as success.
  ci-ok:
    name: ci-ok
    needs: [changes, client, client-e2e, repo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check needed jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A needed job ended with: $result"; exit 1 ;;
            esac
          done
